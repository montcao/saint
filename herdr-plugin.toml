id = "saint"
name = "saint"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Open panes whose agent runs in an Apple container microVM, with credentials held by a host proxy."

# herdr runs this once at `herdr plugin install`: a prebuilt binary when the
# release has one for this commit, otherwise a build from source with Go. A
# linked checkout needs `make build` run by hand.
[[build]]
command = ["sh", "scripts/plugin-build"]

# The one command a new install runs: herdr plugin action invoke setup
# --plugin saint. It opens the setup pane below, which offers to bind keys.
[[actions]]
id = "setup"
title = "saint: set up (keys, image, credential, firewall)"
contexts = ["workspace"]
command = ["./saint", "herdr", "setup"]

[[actions]]
id = "new"
title = "saint: new sandboxed Claude pane"
contexts = ["workspace"]
command = ["./saint", "herdr", "open", "claude"]

[[actions]]
id = "new-codex"
title = "saint: new sandboxed Codex pane"
contexts = ["workspace"]
command = ["./saint", "herdr", "open", "codex"]

# Flips whether Claude Code's own background traffic (metrics, error reports,
# its auto-updater) may leave a session, and says which in a notification.
[[actions]]
id = "telemetry"
title = "saint: turn Claude Code telemetry on or off"
contexts = ["workspace"]
command = ["./saint", "herdr", "telemetry"]

# Opened by the actions above with SAINT_REPO and SAINT_RUNTIME set, or with
# SAINT_SESSION set to reattach to an existing session.
[[panes]]
id = "session"
title = "saint"
placement = "split"
command = ["./saint", "herdr", "pane"]

# Opened by the setup action. It asks one question per step and offers to
# add saint's keys to herdr's config.toml, which herdr checks first.
[[panes]]
id = "setup"
title = "saint: setup"
placement = "split"
command = ["./saint", "herdr", "setup-pane"]

# Opened by the proxy as a split beside a session's pane, without focus, with
# SAINT_EGRESS_SESSION set, when that session asks to reach a host nobody has
# ruled on. It asks "Allow always" or "Deny" and exits when nothing is pending.
[[panes]]
id = "egress"
title = "saint: network access"
placement = "split"
command = ["./saint", "herdr", "egress"]
